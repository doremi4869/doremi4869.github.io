<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="">
    <meta property="og:title" content="">
    <meta property="og:description" content="">
    <meta name="twitter:title" content="">
    <meta name="twitter:description" content="">
    <title></title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="stage" aria-label="Terminal portfolio">
      <div class="ambient ambient-a">
        <img src="kaito-cutout.png" alt="">
      </div>

      <section class="terminal-shell" aria-label="Interactive terminal">
        <header class="terminal-bar">
          <p id="terminal-title">jinyangli:~/home</p>
        </header>

        <div id="terminal-output" class="terminal-output" aria-live="polite"></div>

        <form id="terminal-form" class="terminal-form" autocomplete="off">
          <label id="prompt-label" class="prompt-label" for="terminal-input">
            jinyangli:~/home %
          </label>
          <div class="terminal-entry">
            <span id="input-before" class="input-mirror" aria-hidden="true"></span>
            <span class="terminal-cursor" aria-hidden="true"></span>
            <span id="input-after" class="input-mirror input-after" aria-hidden="true"></span>
            <input
              id="terminal-input"
              class="terminal-input"
              name="command"
              type="text"
              spellcheck="false"
              aria-labelledby="prompt-label"
              autofocus
            >
          </div>
        </form>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
